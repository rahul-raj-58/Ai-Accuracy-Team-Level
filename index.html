<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Operations - Team Level Analytics</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #1a1a1a;
      --paper: #2d2d2d;
      --ink: #f5f5f5;
      --ink-soft: #b0b0b0;
      --ink-faint: #666;
      --accent: #ff6b35;
    }
    html[data-theme="light"] {
      --bg: #f5f5f5;
      --paper: #ffffff;
      --ink: #16140f;
      --ink-soft: #666;
      --ink-faint: #999;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
    }

    header {
      background: var(--paper);
      border-bottom: 1px solid #444;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }
    header h1 { font-size: 28px; font-weight: 600; }
    .header-right { display: flex; align-items: center; gap: 20px; }
    .sync-info { font-size: 12px; color: var(--ink-faint); text-align: right; }
    .sync-btn {
      padding: 8px 16px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
    .sync-btn:hover { opacity: 0.9; }
    .sync-btn.loading { opacity: 0.6; cursor: not-allowed; }
    .theme-toggle {
      background: #444;
      border: none;
      color: var(--ink);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
    }

    main { max-width: 1400px; margin: 0 auto; padding: 40px 20px; }

    .message {
      padding: 16px 20px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: none;
    }
    .message.show { display: block; }
    .message.info { background: #0066cc; color: white; }
    .message.error { background: #cc0000; color: white; }

    .filters {
      background: var(--paper);
      border: 1px solid #444;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 40px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }
    .filter-group label { display: block; font-size: 12px; color: var(--ink-faint); margin-bottom: 8px; font-weight: 600; }
    .filter-group input,
    .filter-group select {
      width: 100%;
      padding: 10px;
      background: var(--bg);
      border: 1px solid #444;
      border-radius: 4px;
      color: var(--ink);
      font-size: 14px;
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .kpi {
      background: var(--paper);
      border: 1px solid #444;
      border-radius: 8px;
      padding: 24px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .kpi:hover { border-color: var(--accent); }
    .kpi-label { font-size: 12px; color: var(--ink-faint); margin-bottom: 12px; font-weight: 600; }
    .kpi-value { font-size: 48px; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
    .kpi-sub { font-size: 12px; color: var(--ink-soft); }

    .chart-section {
      background: var(--paper);
      border: 1px solid #444;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 40px;
    }
    .chart-section h2 { font-size: 18px; margin-bottom: 24px; }
    canvas { width: 100%; max-height: 400px; }

    .detail-panel {
      background: var(--paper);
      border: 1px solid #444;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 40px;
      display: none;
    }
    .detail-panel.show { display: block; }
    .detail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .detail-close { background: #444; border: none; color: var(--ink); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 18px; }
    .detail-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .detail-table thead { background: var(--bg); border-bottom: 2px solid #444; }
    .detail-table th { padding: 12px; text-align: left; font-weight: 600; cursor: pointer; color: var(--ink-soft); }
    .detail-table th:hover { color: var(--accent); }
    .detail-table td { padding: 12px; border-bottom: 1px solid #444; }
    .detail-table tr:hover { background: var(--bg); }
  </style>
</head>
<body>
  <header>
    <h1>📊 Image Operations - Team Level</h1>
    <div class="header-right">
      <div class="sync-info">
        <div id="lastSync">Last sync: Never</div>
        <div id="nextSync">Next sync: Soon</div>
      </div>
      <button class="sync-btn" id="syncBtn">Sync Now</button>
      <button class="theme-toggle" id="themeToggle">🌙</button>
    </div>
  </header>

  <main>
    <div class="message info" id="message"></div>

    <div class="filters">
      <div class="filter-group">
        <label>Date From</label>
        <input type="date" id="dateFrom">
      </div>
      <div class="filter-group">
        <label>Date To</label>
        <input type="date" id="dateTo">
      </div>
      <div class="filter-group">
        <label>Account Type</label>
        <select id="accountType">
          <option value="">All Types</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Enterprise (Optional)</label>
        <select id="enterprise">
          <option value="">All Enterprises</option>
        </select>
      </div>
    </div>

    <div class="kpis">
      <div class="kpi" data-card="enterprises">
        <div class="kpi-label">Unique Enterprises</div>
        <div class="kpi-value" id="kpiEnterprises">—</div>
        <div class="kpi-sub">Click to see breakdown</div>
      </div>
      <div class="kpi" data-card="teams">
        <div class="kpi-label">Unique Teams</div>
        <div class="kpi-value" id="kpiTeams">—</div>
        <div class="kpi-sub">Click to see breakdown</div>
      </div>
      <div class="kpi" data-card="images">
        <div class="kpi-label">Unique Images</div>
        <div class="kpi-value" id="kpiImages">—</div>
        <div class="kpi-sub">Click to see breakdown</div>
      </div>
      <div class="kpi" data-card="skus">
        <div class="kpi-label">Unique SKUs</div>
        <div class="kpi-value" id="kpiSkus">—</div>
        <div class="kpi-sub">Click to see breakdown</div>
      </div>
    </div>

    <div class="chart-section">
      <h2>Top 10 Rejection Reasons</h2>
      <canvas id="chart"></canvas>
    </div>

    <div class="detail-panel" id="detailPanel">
      <div class="detail-header">
        <h2 id="detailTitle">Details</h2>
        <button class="detail-close" id="detailClose">✕</button>
      </div>
      <table class="detail-table">
        <thead id="detailHead"></thead>
        <tbody id="detailBody"></tbody>
      </table>
    </div>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    const msg = text => { const el = $('message'); el.textContent = text; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 5000); };
    const fmt = n => n ? n.toLocaleString() : '0';

    let state = {
      data: [],
      filtered: [],
      currentCard: null
    };

    // Safe rejection parsing
    function parseRejections(str) {
      if (!str || typeof str !== 'string') return [];
      try {
        const parsed = JSON.parse(str);
        if (!Array.isArray(parsed)) return [];
        // Only get first 100 items to prevent stack overflow
        return parsed.slice(0, 100);
      } catch {
        return [];
      }
    }

    async function fetchData() {
      $('syncBtn').classList.add('loading');
      try {
        const res = await fetch('/api/data');
        const json = await res.json();
        if (!json.ok) throw new Error(json.error || 'Failed to load');
        state.data = (json.records || []).slice(0, 5000); // Limit to 5000 records
        $('lastSync').textContent = `Last sync: ${new Date().toLocaleTimeString()}`;
        updateDashboard();
        msg(`✓ Data loaded (${fmt(state.data.length)} records)`);
      } catch (err) {
        msg(`✗ Error: ${err.message}`);
      } finally {
        $('syncBtn').classList.remove('loading');
      }
    }

    function applyFilters() {
      const dateFrom = $('dateFrom').value ? new Date($('dateFrom').value) : null;
      const dateTo = $('dateTo').value ? new Date($('dateTo').value) : null;
      if (dateTo) dateTo.setHours(23, 59, 59);
      const acctType = $('accountType').value;
      const ent = $('enterprise').value;

      state.filtered = state.data.filter(r => {
        if (dateFrom && new Date(r.createdDate) < dateFrom) return false;
        if (dateTo && new Date(r.createdDate) > dateTo) return false;
        if (acctType && r.account_type !== acctType) return false;
        if (ent && r.enterprise_name !== ent) return false;
        return true;
      });

      updateDashboard();
    }

    function calculateKPIs() {
      const ents = new Set(state.filtered.map(r => r.enterprise_name).filter(Boolean));
      const teams = new Set(state.filtered.map(r => r.team_id).filter(Boolean));
      const imgs = state.filtered.reduce((s, r) => s + parseInt(r.unique_images || 0), 0);
      const skus = state.filtered.reduce((s, r) => s + parseInt(r.unique_sku_count || 0), 0);

      $('kpiEnterprises').textContent = fmt(ents.size);
      $('kpiTeams').textContent = fmt(teams.size);
      $('kpiImages').textContent = fmt(imgs);
      $('kpiSkus').textContent = fmt(skus);
    }

    function buildRejectionChart() {
      const counts = {};
      
      // Safely iterate through filtered records
      for (let i = 0; i < Math.min(state.filtered.length, 1000); i++) {
        const r = state.filtered[i];
        if (!r.rejected_comment_counts) continue;
        
        const rejections = parseRejections(r.rejected_comment_counts);
        if (!Array.isArray(rejections)) continue;
        
        for (let j = 0; j < rejections.length; j++) {
          const item = rejections[j];
          if (!Array.isArray(item) || item.length < 2) continue;
          const [reason, count] = item;
          if (!reason || !count) continue;
          counts[reason] = (counts[reason] || 0) + parseInt(count || 0);
        }
      }

      const sorted = Object.entries(counts)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 10);

      drawChart(sorted);
    }

    function drawChart(data) {
      const canvas = $('chart');
      const ctx = canvas.getContext('2d');
      const w = canvas.offsetWidth || 800;
      const h = 350;
      canvas.width = w;
      canvas.height = h;

      if (!data || data.length === 0) {
        ctx.fillStyle = '#666';
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('No rejection data', w / 2, h / 2);
        return;
      }

      const padding = { left: 50, right: 20, top: 20, bottom: 80 };
      const plotW = w - padding.left - padding.right;
      const plotH = h - padding.top - padding.bottom;
      const barW = plotW / data.length * 0.8;
      const spacing = plotW / data.length;
      const maxVal = Math.max(...data.map(d => d[1]));

      ctx.fillStyle = '#ff6b35';
      for (let i = 0; i < data.length; i++) {
        const x = padding.left + i * spacing + spacing * 0.1;
        const barH = (data[i][1] / maxVal) * plotH;
        const y = padding.top + plotH - barH;
        ctx.fillRect(x, y, barW, barH);
      }

      ctx.fillStyle = '#f5f5f5';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      for (let i = 0; i < data.length; i++) {
        const x = padding.left + i * spacing + spacing / 2;
        ctx.save();
        ctx.translate(x, h - padding.bottom + 20);
        ctx.rotate(-Math.PI / 4);
        ctx.fillText(String(data[i][0]).slice(0, 15), 0, 0);
        ctx.restore();
      }
    }

    function showDetail(card) {
      state.currentCard = card;
      const panel = $('detailPanel');
      panel.classList.add('show');
    }

    function updateDashboard() {
      applyFilters();
      calculateKPIs();
      buildRejectionChart();
      populateFilters();
    }

    function populateFilters() {
      const accts = [...new Set(state.data.map(r => r.account_type).filter(Boolean))].sort();
      const ents = [...new Set(state.data.map(r => r.enterprise_name).filter(Boolean))].sort();

      $('accountType').innerHTML = '<option value="">All Types</option>' + accts.map(a => `<option>${a}</option>`).join('');
      $('enterprise').innerHTML = '<option value="">All Enterprises</option>' + ents.map(e => `<option>${e}</option>`).join('');
    }

    $('syncBtn').addEventListener('click', fetchData);
    $('dateFrom').addEventListener('change', applyFilters);
    $('dateTo').addEventListener('change', applyFilters);
    $('accountType').addEventListener('change', applyFilters);
    $('enterprise').addEventListener('change', applyFilters);
    $('detailClose').addEventListener('click', () => { $('detailPanel').classList.remove('show'); state.currentCard = null; });

    document.querySelectorAll('[data-card]').forEach(el => {
      el.addEventListener('click', () => showDetail(el.dataset.card));
    });

    $('themeToggle').addEventListener('click', () => {
      const html = document.documentElement;
      const isDark = html.getAttribute('data-theme') === 'dark';
      html.setAttribute('data-theme', isDark ? 'light' : 'dark');
      $('themeToggle').textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('theme', isDark ? 'light' : 'dark');
    });

    const today = new Date();
    const month = new Date(today.getFullYear(), today.getMonth(), 1);
    $('dateFrom').valueAsDate = month;
    $('dateTo').valueAsDate = today;

    const theme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', theme);
    $('themeToggle').textContent = theme === 'dark' ? '🌙' : '☀️';

    setInterval(fetchData, 2 * 60 * 60 * 1000);
    fetchData();
  </script>
</body>
</html>
