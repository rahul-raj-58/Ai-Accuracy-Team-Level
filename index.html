<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Operations - Team Level Analytics</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #1a1a1a;
      --paper: #2d2d2d;
      --ink: #f5f5f5;
      --ink-soft: #b0b0b0;
      --ink-faint: #666;
      --accent: #ff6b35;
      --success: #2ecc71;
      --rule: #444;
    }
    html[data-theme="light"] {
      --bg: #f5f5f5;
      --paper: #ffffff;
      --ink: #16140f;
      --ink-soft: #666;
      --ink-faint: #999;
      --rule: #ddd;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
    }

    /* Header */
    header {
      background: var(--paper);
      border-bottom: 1px solid var(--rule);
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }
    header h1 { font-size: 28px; font-weight: 600; }
    .header-right { display: flex; align-items: center; gap: 20px; }
    .sync-info { font-size: 12px; color: var(--ink-faint); text-align: right; }
    .sync-btn {
      padding: 8px 16px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sync-btn:hover { opacity: 0.9; }
    .sync-btn.loading { opacity: 0.6; cursor: not-allowed; }
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top: 2px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .theme-toggle {
      background: var(--rule);
      border: none;
      color: var(--ink);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
    }

    /* Main container */
    main { max-width: 1400px; margin: 0 auto; padding: 40px 20px; }

    /* Filters */
    .filters {
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 40px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }
    .filter-group label { display: block; font-size: 12px; color: var(--ink-faint); margin-bottom: 8px; font-weight: 600; }
    .filter-group input,
    .filter-group select {
      width: 100%;
      padding: 10px;
      background: var(--bg);
      border: 1px solid var(--rule);
      border-radius: 4px;
      color: var(--ink);
      font-size: 14px;
    }

    /* KPI Cards */
    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .kpi {
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 8px;
      padding: 24px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .kpi:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 16px rgba(255,107,53,0.1); }
    .kpi-label { font-size: 12px; color: var(--ink-faint); margin-bottom: 12px; font-weight: 600; }
    .kpi-value { font-size: 48px; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
    .kpi-sub { font-size: 12px; color: var(--ink-soft); }

    /* Chart */
    .chart-section {
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 40px;
    }
    .chart-section h2 { font-size: 18px; margin-bottom: 24px; }
    canvas { width: 100%; max-height: 400px; }

    /* Detail Panel */
    .detail-panel {
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 40px;
      display: none;
    }
    .detail-panel.show { display: block; }
    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .detail-header h2 { font-size: 20px; }
    .detail-close {
      background: var(--rule);
      border: none;
      color: var(--ink);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
    }
    .detail-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    .detail-table thead {
      background: var(--bg);
      border-bottom: 2px solid var(--rule);
    }
    .detail-table th {
      padding: 12px;
      text-align: left;
      font-weight: 600;
      cursor: pointer;
      color: var(--ink-soft);
    }
    .detail-table th:hover { color: var(--accent); }
    .detail-table td {
      padding: 12px;
      border-bottom: 1px solid var(--rule);
    }
    .detail-table tr:hover { background: var(--bg); }

    /* Search */
    .detail-search {
      margin-bottom: 20px;
    }
    .detail-search input {
      width: 100%;
      max-width: 300px;
      padding: 10px;
      background: var(--bg);
      border: 1px solid var(--rule);
      border-radius: 4px;
      color: var(--ink);
    }

    /* Loading/Error states */
    .message {
      padding: 16px 20px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: none;
    }
    .message.show { display: block; }
    .message.info { background: #0066cc; color: white; }
    .message.error { background: #cc0000; color: white; }
    .message.success { background: var(--success); color: white; }
  </style>
</head>
<body>
  <header>
    <h1>📊 Image Operations - Team Level</h1>
    <div class="header-right">
      <div class="sync-info">
        <div id="lastSync">Last sync: Never</div>
        <div id="nextSync">Next sync: Soon</div>
      </div>
      <button class="sync-btn" id="syncBtn">
        <span class="spinner" id="syncSpinner" style="display:none;"></span>
        <span id="syncText">Sync Now</span>
      </button>
      <button class="theme-toggle" id="themeToggle">🌙</button>
    </div>
  </header>

  <main>
    <div class="message info" id="message"></div>

    <!-- Filters -->
    <div class="filters">
      <div class="filter-group">
        <label>Date From</label>
        <input type="date" id="dateFrom">
      </div>
      <div class="filter-group">
        <label>Date To</label>
        <input type="date" id="dateTo">
      </div>
      <div class="filter-group">
        <label>Account Type</label>
        <select id="accountType" multiple>
          <option value="">All Types</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Enterprise (Optional)</label>
        <select id="enterprise">
          <option value="">All Enterprises</option>
        </select>
      </div>
    </div>

    <!-- KPI Cards -->
    <div class="kpis">
      <div class="kpi" data-card="enterprises">
        <div class="kpi-label">Unique Enterprises</div>
        <div class="kpi-value" id="kpiEnterprises">—</div>
        <div class="kpi-sub">Click to see breakdown</div>
      </div>
      <div class="kpi" data-card="teams">
        <div class="kpi-label">Unique Teams</div>
        <div class="kpi-value" id="kpiTeams">—</div>
        <div class="kpi-sub">Click to see breakdown</div>
      </div>
      <div class="kpi" data-card="images">
        <div class="kpi-label">Unique Images</div>
        <div class="kpi-value" id="kpiImages">—</div>
        <div class="kpi-sub">Click to see breakdown</div>
      </div>
      <div class="kpi" data-card="skus">
        <div class="kpi-label">Unique SKUs</div>
        <div class="kpi-value" id="kpiSkus">—</div>
        <div class="kpi-sub">Click to see breakdown</div>
      </div>
    </div>

    <!-- Chart -->
    <div class="chart-section">
      <h2>Top 10 Rejection Reasons</h2>
      <canvas id="chart"></canvas>
    </div>

    <!-- Detail Panel -->
    <div class="detail-panel" id="detailPanel">
      <div class="detail-header">
        <h2 id="detailTitle">Details</h2>
        <button class="detail-close" id="detailClose">✕</button>
      </div>
      <div class="detail-search">
        <input type="text" id="detailSearch" placeholder="Search...">
      </div>
      <table class="detail-table">
        <thead id="detailHead"></thead>
        <tbody id="detailBody"></tbody>
      </table>
    </div>
  </main>

  <script>
    // State
    const state = {
      data: [],
      filtered: [],
      currentCard: null,
      sortKey: null,
      sortDir: 'asc',
      searchTerm: '',
    };

    // DOM Refs
    const $ = id => document.getElementById(id);
    const msg = msg => {
      const el = $('message');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 5000);
    };

    // Format number
    const fmt = n => n ? n.toLocaleString() : '0';

    // Parse rejection counts
    const parseRejections = (str) => {
      if (!str) return [];
      try {
        const parsed = JSON.parse(str);
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    };

    // Fetch data
    async function fetchData() {
      $('syncBtn').classList.add('loading');
      $('syncSpinner').style.display = 'inline-block';
      try {
        const res = await fetch('/api/data');
        const json = await res.json();
        if (!json.ok) throw new Error(json.error);
        state.data = json.records || [];
        $('lastSync').textContent = `Last sync: ${new Date().toLocaleTimeString()}`;
        $('nextSync').textContent = `Next sync: in 2 hours`;
        updateDashboard();
        msg(`✓ Data loaded (${fmt(state.data.length)} records)`);
      } catch (err) {
        msg(`✗ Error: ${err.message}`);
      } finally {
        $('syncBtn').classList.remove('loading');
        $('syncSpinner').style.display = 'none';
      }
    }

    // Apply filters
    function applyFilters() {
      const dateFrom = new Date($('dateFrom').value);
      const dateTo = new Date($('dateTo').value);
      dateTo.setHours(23, 59, 59);
      const accountType = $('accountType').value;
      const enterprise = $('enterprise').value;

      state.filtered = state.data.filter(r => {
        const d = new Date(r.createdDate);
        if (dateFrom && d < dateFrom) return false;
        if (dateTo && d > dateTo) return false;
        if (accountType && r.account_type !== accountType) return false;
        if (enterprise && r.enterprise_name !== enterprise) return false;
        return true;
      });

      updateDashboard();
    }

    // Calculate KPIs
    function calculateKPIs() {
      const enterprises = new Set(state.filtered.map(r => r.enterprise_name));
      const teams = new Set(state.filtered.map(r => r.team_id));
      const images = state.filtered.reduce((sum, r) => sum + parseInt(r.unique_images || 0), 0);
      const skus = state.filtered.reduce((sum, r) => sum + parseInt(r.unique_sku_count || 0), 0);

      $('kpiEnterprises').textContent = fmt(enterprises.size);
      $('kpiTeams').textContent = fmt(teams.size);
      $('kpiImages').textContent = fmt(images);
      $('kpiSkus').textContent = fmt(skus);
    }

    // Build rejection chart data
    function buildRejectionChart() {
      const counts = {};
      for (const r of state.filtered) {
        const rejections = parseRejections(r.rejected_comment_counts);
        for (const [reason, count] of rejections) {
          counts[reason] = (counts[reason] || 0) + count;
        }
      }

      const sorted = Object.entries(counts)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 10);

      drawChart(sorted);
    }

    // Draw bar chart
    function drawChart(data) {
      const canvas = $('chart');
      const ctx = canvas.getContext('2d');
      const w = canvas.offsetWidth;
      const h = 350;
      canvas.width = w;
      canvas.height = h;

      if (data.length === 0) {
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--ink-faint');
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('No rejection data', w / 2, h / 2);
        return;
      }

      const padding = { left: 50, right: 20, top: 20, bottom: 80 };
      const plotW = w - padding.left - padding.right;
      const plotH = h - padding.top - padding.bottom;
      const barW = plotW / data.length * 0.8;
      const spacing = plotW / data.length;

      const maxVal = Math.max(...data.map(d => d[1]));

      // Draw bars
      ctx.fillStyle = '#ff6b35';
      data.forEach((d, i) => {
        const x = padding.left + i * spacing + spacing * 0.1;
        const barH = (d[1] / maxVal) * plotH;
        const y = padding.top + plotH - barH;
        ctx.fillRect(x, y, barW, barH);
      });

      // Draw labels
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--ink');
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      data.forEach((d, i) => {
        const x = padding.left + i * spacing + spacing / 2;
        ctx.save();
        ctx.translate(x, h - padding.bottom + 20);
        ctx.rotate(-Math.PI / 4);
        ctx.fillText(d[0].slice(0, 15), 0, 0);
        ctx.restore();

        // Value on top of bar
        const barH = (d[1] / maxVal) * plotH;
        const y = padding.top + plotH - barH - 10;
        ctx.fillText(fmt(d[1]), x, y);
      });
    }

    // Show detail panel
    function showDetail(card) {
      state.currentCard = card;
      const panel = $('detailPanel');
      const titles = {
        enterprises: 'Enterprise Breakdown',
        teams: 'Team Breakdown',
        images: 'Image Count Breakdown',
        skus: 'SKU Count Breakdown',
      };
      $('detailTitle').textContent = titles[card];
      
      const columns = {
        enterprises: ['enterprise_name', 'team_name', 'account_type', 'unique_images', 'unique_sku_count'],
        teams: ['team_id', 'enterprise_name', 'account_type', 'unique_images', 'unique_sku_count'],
        images: ['enterprise_name', 'team_name', 'account_type', 'unique_images'],
        skus: ['enterprise_name', 'team_name', 'account_type', 'unique_sku_count'],
      };

      const cols = columns[card];
      const head = $('detailHead');
      head.innerHTML = `<tr>${cols.map(c => `<th>${c.replace(/_/g, ' ')}</th>`).join('')}</tr>`;

      renderDetailTable(cols);
      panel.classList.add('show');
    }

    // Render detail table
    function renderDetailTable(cols) {
      const body = $('detailBody');
      const search = $('detailSearch').value.toLowerCase();

      const rows = state.filtered
        .filter(r => !search || Object.values(r).some(v => String(v).toLowerCase().includes(search)))
        .map(r => cols.map(c => r[c] || '').join('|'))
        .filter((v, i, a) => a.indexOf(v) === i) // dedupe
        .map(row => {
          const cells = row.split('|');
          return `<tr>${cells.map(c => `<td>${c}</td>`).join('')}</tr>`;
        })
        .join('');

      body.innerHTML = rows || '<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--ink-faint);">No data</td></tr>';
    }

    // Update all
    function updateDashboard() {
      applyFilters();
      calculateKPIs();
      buildRejectionChart();
      populateFilterOptions();
    }

    // Populate filter dropdowns
    function populateFilterOptions() {
      const acctTypes = new Set(state.data.map(r => r.account_type).filter(Boolean));
      const enterprises = new Set(state.data.map(r => r.enterprise_name).filter(Boolean));

      $('accountType').innerHTML = '<option value="">All Types</option>' +
        [...acctTypes].sort().map(t => `<option value="${t}">${t}</option>`).join('');

      $('enterprise').innerHTML = '<option value="">All Enterprises</option>' +
        [...enterprises].sort().map(e => `<option value="${e}">${e}</option>`).join('');
    }

    // Event listeners
    $('syncBtn').addEventListener('click', () => fetchData());
    $('dateFrom').addEventListener('change', applyFilters);
    $('dateTo').addEventListener('change', applyFilters);
    $('accountType').addEventListener('change', applyFilters);
    $('enterprise').addEventListener('change', applyFilters);
    $('detailClose').addEventListener('click', () => {
      $('detailPanel').classList.remove('show');
      state.currentCard = null;
    });
    $('detailSearch').addEventListener('input', () => {
      if (state.currentCard) renderDetailTable(
        state.currentCard === 'enterprises' ? ['enterprise_name', 'team_name', 'account_type', 'unique_images', 'unique_sku_count'] :
        state.currentCard === 'teams' ? ['team_id', 'enterprise_name', 'account_type', 'unique_images', 'unique_sku_count'] :
        state.currentCard === 'images' ? ['enterprise_name', 'team_name', 'account_type', 'unique_images'] :
        ['enterprise_name', 'team_name', 'account_type', 'unique_sku_count']
      );
    });

    // KPI card clicks
    document.querySelectorAll('[data-card]').forEach(el => {
      el.addEventListener('click', () => showDetail(el.dataset.card));
    });

    // Theme toggle
    $('themeToggle').addEventListener('click', () => {
      const html = document.documentElement;
      const isDark = html.getAttribute('data-theme') === 'dark';
      html.setAttribute('data-theme', isDark ? 'light' : 'dark');
      $('themeToggle').textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('theme', isDark ? 'light' : 'dark');
    });

    // Set date defaults
    const today = new Date();
    const month = new Date(today.getFullYear(), today.getMonth(), 1);
    $('dateFrom').valueAsDate = month;
    $('dateTo').valueAsDate = today;

    // Load theme preference
    const theme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', theme);
    $('themeToggle').textContent = theme === 'dark' ? '🌙' : '☀️';

    // Auto-refresh every 2 hours
    setInterval(fetchData, 2 * 60 * 60 * 1000);

    // Initial load
    fetchData();
  </script>
</body>
</html>
